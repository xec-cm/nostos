name: Bug report
description: Report a reproducible problem in the current package or docs.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        recoverome is currently an experimental scaffold. Analysis functions
        shown as planned API are not implemented. Please omit private data.
  - type: textarea
    id: problem
    attributes:
      label: Observed and expected behavior
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Reproducible example
      description: Provide the smallest example, or the affected docs URL.
      render: r
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and output
      description: Include relevant errors and sessionInfo() output.
      render: text
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Impact and workaround
      description: Explain which workflow is affected and any known workaround.
    validations:
      required: false
