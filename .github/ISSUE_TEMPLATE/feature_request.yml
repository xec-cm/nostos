name: Feature or method proposal
description: Propose a concrete user workflow, contract, or analytical method.
title: "[Proposal]: "
body:
  - type: textarea
    id: question
    attributes:
      label: User question
      description: Which analysis or development problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe inputs, outputs, and how this fits the current design.
    validations:
      required: true
  - type: textarea
    id: assumptions
    attributes:
      label: Assumptions and validation
      description: For methods, state the estimand, assumptions, and validation plan.
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: Related work
      description: Link relevant papers, implementations, or existing issues.
    validations:
      required: false
