name: Feature request
description: Describe a user need for triage before design or implementation.
title: "[Proposal]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This form captures a user need. It does not accept a design or make
        implementation Ready. Use a design RFC for API, contract, or
        methodological decisions. RFCs become accepted when the maintainer
        merges their short design-document PR; a feature issue is not that PR.
  - type: textarea
    id: question
    attributes:
      label: User question
      description: Which analysis or development problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired workflow and how it fits the MVP scope.
    validations:
      required: true
  - type: textarea
    id: assumptions
    attributes:
      label: Assumptions and validation
      description: For methods, state the estimand, assumptions, and validation plan.
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: Related work
      description: Link relevant papers, implementations, or existing issues.
    validations:
      required: false
