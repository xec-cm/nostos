name: R-CMD-check-bioc

on:
  push:
    branches: [devel]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

concurrency:
  group: check-bioc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  R_KEEP_PKG_SOURCE: "yes"

jobs:
  bioc-config:
    name: Resolve compatible R and Bioconductor versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: release
      - name: Install resolver dependencies
        shell: Rscript --vanilla {0}
        run: install.packages(c("yaml", "jsonlite"), repos = "https://cloud.r-project.org")
      - name: Resolve matrix from the official Bioconductor configuration
        id: matrix
        shell: bash
        run: Rscript --vanilla dev/resolve-bioc.R >> "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.channel }} / ${{ matrix.os }} / R ${{ matrix.r }}
    needs: bioc-config
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.bioc-config.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      R_BIOC_VERSION: ${{ matrix.bioc }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
      - name: Install package and check dependencies
        uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          needs: check
          extra-packages: any::BiocManager
          cache-version: bioc-${{ matrix.bioc }}-1
      - name: Confirm Bioconductor repositories
        shell: Rscript --vanilla {0}
        run: |
          repositories <- BiocManager::repositories(version = Sys.getenv("R_BIOC_VERSION"))
          print(repositories)
          print(sessionInfo())
      - name: Build and check the package, including vignettes
        shell: bash
        run: Rscript --vanilla dev/check-package.R
      - name: Record checked source identity
        if: matrix.channel == 'release' && matrix.os == 'ubuntu-latest'
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          printf 'source_commit=%s\nchecked_commit=%s\n' \
            "$SOURCE_COMMIT" "$(git rev-parse HEAD)" > check/candidate.txt
          sha256sum check/*.tar.gz >> check/candidate.txt
      - name: Preserve the checked source package
        if: matrix.channel == 'release' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checked-source-package
          path: |
            check/*.tar.gz
            check/candidate.txt
            check/nostos.Rcheck/00check.log
          if-no-files-found: error
          retention-days: 14
      - name: Report Bioconductor readiness
        if: matrix.channel == 'devel'
        shell: bash
        run: Rscript --vanilla dev/check-bioc.R
      - name: Preserve Bioconductor readiness report
        if: always() && matrix.channel == 'devel'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bioccheck-readiness
          path: bioccheck-report.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve check logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-${{ matrix.channel }}-${{ matrix.os }}
          path: check
          if-no-files-found: warn
          retention-days: 14

  package-checks:
    name: R package checks
    needs: [bioc-config, check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the resolver and every matrix job to succeed
        env:
          BIOC_CONFIG_RESULT: ${{ needs.bioc-config.result }}
          MATRIX_RESULT: ${{ needs.check.result }}
        shell: bash
        run: |
          if [[ "$BIOC_CONFIG_RESULT" != "success" || "$MATRIX_RESULT" != "success" ]]; then
            printf '::error::R package checks require a successful resolver (%s) and matrix (%s).\n' \
              "$BIOC_CONFIG_RESULT" "$MATRIX_RESULT"
            exit 1
          fi
