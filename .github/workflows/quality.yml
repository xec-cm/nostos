name: Quality

on:
  push:
    branches: [devel]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          needs: quality, website
      - name: Check R style
        shell: Rscript --vanilla {0}
        run: |
          lints <- c(lintr::lint_package(), lintr::lint_dir("dev"))
          print(lints)
          if (length(lints)) quit(status = 1L)
      - name: Check generated documentation is current
        shell: bash
        run: Rscript --vanilla dev/check-generated.R
      - name: Validate GitHub Actions workflows
        shell: bash
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
