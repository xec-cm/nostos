name: Quality

on:
  push:
    branches: [devel]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          needs: quality, website
      - name: Check R style
        shell: Rscript --vanilla {0}
        run: |
          pkgload::load_all(".", quiet = TRUE, export_all = FALSE, helpers = FALSE)
          lints <- c(lintr::lint_package(), lintr::lint_dir("dev"))
          print(lints)
          if (length(lints)) quit(status = 1L)
      - name: Check generated documentation is current
        shell: bash
        run: Rscript --vanilla dev/check-generated.R
      - name: Validate GitHub Actions workflows
        shell: bash
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
