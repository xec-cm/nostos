name: pkgdown

on:
  push:
    branches: [devel]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkgdown-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  TZ: UTC

jobs:
  build:
    name: Build the documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          needs: website
      - name: Validate and build pkgdown
        shell: Rscript --vanilla {0}
        run: |
          pkgdown::check_pkgdown(".")
          pkgdown::build_site_github_pages(new_process = FALSE, install = TRUE)
      - name: Preserve a pull request preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkgdown-preview
          path: docs
          if-no-files-found: error
          retention-days: 7
      - name: Prepare the Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/devel'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    name: Publish the documentation site
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/devel'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
